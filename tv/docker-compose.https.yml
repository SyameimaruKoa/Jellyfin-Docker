# Standalone TLS gateway using the existing Tailscale certificate manager.
services:
  tv-https:
    image: ${CECH_TLS_IMAGE:-nginx@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea}
    init: true
    user: "1000:1000"
    group_add: ["${CECH_TLS_CERT_GID:?Set numeric tailscale-certs GID}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint: [/bin/sh, /app/start.sh]
    environment:
      CECH_TLS_SERVER_NAME: ${CECH_TLS_SERVER_NAME:?Set certificate FQDN}
      CECH_TLS_KONOMI_UPSTREAM: ${CECH_TLS_KONOMI_UPSTREAM:?Set KonomiTV container hostname and HTTP port}
      CECH_TLS_JELLYFIN_UPSTREAM: ${CECH_TLS_JELLYFIN_UPSTREAM:-jellyfin:8096}
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    volumes:
      - ./tv/docker/tv-https:/app:ro
      - ${CECH_TLS_CERT_DIR:-/etc/tailscale-certs}:/tls:ro
    ports:
      - "${CECH_TLS_BIND:?Set Tailscale address}:7443:7443"
      - "${CECH_TLS_BIND}:8443:8443"
      - "127.0.0.1:7443:7443"
      - "127.0.0.1:8443:8443"
    networks: [jellyfin]
networks:
  jellyfin:
    name: ${CECH_JELLYFIN_NETWORK:?Set existing apps network}
    external: true
