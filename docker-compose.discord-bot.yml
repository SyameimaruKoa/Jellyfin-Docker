services:
    jellyfin-discord-bot:
        image: "${JELLYFIN_BOT_IMAGE:-ghcr.io/manuel-rw/jellyfin-discord-music-bot:latest}"
        container_name: jellyfin-discord-bot
        restart: unless-stopped
        depends_on:
            - jellyfin
        environment:
            DISCORD_CLIENT_TOKEN: "${DISCORD_CLIENT_TOKEN:-}"
            JELLYFIN_SERVER_ADDRESS: "${JELLYFIN_BOT_SERVER_ADDRESS:-http://jellyfin:8096}"
            JELLYFIN_AUTHENTICATION_USERNAME: "${JELLYFIN_BOT_USERNAME:-}"
            JELLYFIN_AUTHENTICATION_PASSWORD: "${JELLYFIN_BOT_PASSWORD:-}"
            ALLOW_EVERYONE_FOR_DEFAULT_PERMS: "${JELLYFIN_BOT_ALLOW_EVERYONE:-false}"
            UPDATER_DISABLE_NOTIFICATIONS: "${JELLYFIN_BOT_DISABLE_UPDATE_NOTIFICATIONS:-true}"
