# Standalone optional HTTPS gateway. NOT an override of the HTTP Jellyfin service.
# Based on the existing tv/docker-compose.https.yml, without altering that legacy integration.
# CECH_JELLYFIN_NETWORK must be an existing Docker network reachable by BOTH upstreams.
# Keep the original external bindings: KonomiTV HTTPS 7443, Jellyfin HTTPS 8443.
services:
    tv-https:
        image: "${CECH_TLS_IMAGE:-nginx@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea}"
        init: true
        user: "${CECH_TLS_USER:-1000:1000}"
        group_add:
            - "${CECH_TLS_CERT_GID:?Set CECH_TLS_CERT_GID in .env}"
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        restart: unless-stopped
        entrypoint: [/bin/sh, /app/start.sh]
        environment:
            CECH_TLS_SERVER_NAME: "${CECH_TLS_SERVER_NAME:?Set certificate FQDN in .env}"
            CECH_TLS_KONOMI_UPSTREAM: "${CECH_TLS_KONOMI_UPSTREAM:?Set KonomiTV address in .env}"
            CECH_TLS_JELLYFIN_UPSTREAM: "${CECH_TLS_JELLYFIN_UPSTREAM:-jellyfin:8096}"
        tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
        volumes:
            - ./tv/docker/tv-https:/app:ro
            - "${CECH_TLS_CERT_DIR:-/etc/tailscale-certs}:/tls:ro"
        ports:
            - "${CECH_TLS_BIND:?Set Tailscale IPv4 in .env}:7443:7443"
            - "${CECH_TLS_BIND}:8443:8443"
            - "127.0.0.1:7443:7443"
            - "127.0.0.1:8443:8443"
        networks:
            - shared
networks:
    shared:
        external: true
        name: "${CECH_JELLYFIN_NETWORK:?Set common Docker network in .env}"
