# Jellyfin本体の標準HTTPS（任意）。
# 通常のdocker compose up -dでは読み込まない。
# HTTP 8096はそのまま残し、HTTPS 8920のポート公開だけ追加する。
# 利用する場合はJellyfinの管理画面「ネットワーク」でHTTPSを有効化し、
# PFX形式の証明書とパスワードを設定すること。
# 自己署名証明書は利用できるが、クライアント側では通常信頼されない。
# Cloudflare Tunnelなどの内部転送先は引き続きHTTP 8096でよい。
services:
    jellyfin:
        ports:
            - "8920:8920"
