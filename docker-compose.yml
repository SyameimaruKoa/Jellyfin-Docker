services:
    jellyfin:
        image: jellyfin/jellyfin:preview
        container_name: jellyfin
        hostname: "${HOST_HOSTNAME:-jellyfin}"
        user: "${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}"
        group_add:
            - "${JELLYFIN_RENDER_GID:?Set JELLYFIN_RENDER_GID in .env}"
        # network_mode: 'host'
        ports:
            - "${JELLYFIN_HTTP_PORT:-8096}:8096"
        volumes:
            - ./config:/config
            - ./cache:/cache
            - type: bind
              source: "${JELLYFIN_VIDEOS_DIR:-/mnt/NAS/Documents/Videos}"
              target: /mnt/Videos
              read_only: true
            - type: bind
              source: "${JELLYFIN_MUSIC_DIR:-/mnt/NAS/Documents/Music}"
              target: /mnt/Musics
              read_only: true
            - type: bind
              source: "${JELLYFIN_CD_FLAC_DIR:-/mnt/NAS/Documents/CDリッピング(flac)/}"
              target: /mnt/CD-flac
              read_only: true
        devices:
            - /dev/dri:/dev/dri
        restart: 'unless-stopped'
        # Optional - alternative address used for autodiscovery
        environment:
            - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL:-}
        # Optional - may be necessary for docker healthcheck to pass if running in host network mode
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    jellyfin-discord-bot:
        profiles:
            - discord-bot
        image: "${JELLYFIN_BOT_IMAGE:-ghcr.io/manuel-rw/jellyfin-discord-music-bot:latest}"
        container_name: jellyfin-discord-bot
        restart: unless-stopped
        depends_on:
            - jellyfin
        environment:
            DISCORD_CLIENT_TOKEN: "${DISCORD_CLIENT_TOKEN:-}"
            JELLYFIN_SERVER_ADDRESS: "${JELLYFIN_BOT_SERVER_ADDRESS:-http://jellyfin:8096}"
            JELLYFIN_AUTHENTICATION_USERNAME: "${JELLYFIN_BOT_USERNAME:-}"
            JELLYFIN_AUTHENTICATION_PASSWORD: "${JELLYFIN_BOT_PASSWORD:-}"
            ALLOW_EVERYONE_FOR_DEFAULT_PERMS: "${JELLYFIN_BOT_ALLOW_EVERYONE:-false}"
            UPDATER_DISABLE_NOTIFICATIONS: "${JELLYFIN_BOT_DISABLE_UPDATE_NOTIFICATIONS:-true}"
