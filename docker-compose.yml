services:
    jellyfin:
        image: jellyfin/jellyfin:preview
        container_name: jellyfin
        hostname: "${HOST_HOSTNAME:-jellyfin}"
        user: "1000:1000"
        group_add:
            - "${JELLYFIN_RENDER_GID:?Set JELLYFIN_RENDER_GID in .env}"
        # 通常はポート公開で動作する
        # network_mode: 'host'
        ports:
            - 8096:8096/tcp
            - 7359:7359/udp
        volumes:
            - ./config:/config
            - ./cache:/cache
            - type: bind
              source: /mnt/NAS/Documents/Videos
              target: /mnt/Videos
              read_only: true
            - type: bind
              source: /mnt/NAS/Documents/Music
              target: /mnt/Musics
              read_only: true
            - type: bind
              source: "/mnt/NAS/Documents/CDリッピング(flac)/"
              target: /mnt/CD-flac
              read_only: true
        devices:
            - /dev/dri:/dev/dri
        restart: 'unless-stopped'
        # 自動検出時に通知する公開アドレス
        environment:
            - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_SERVER_URL:-}
        # ホストへの接続時に用いる名前解決
        extra_hosts:
            - 'host.docker.internal:host-gateway'
